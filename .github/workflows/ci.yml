name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Real Postgres for the integration tests (it also backs pg-boss).
    services:
      postgres:
        image: postgres:15.4
        env:
          POSTGRES_USER: mafftserver
          POSTGRES_PASSWORD: mafftserver
          POSTGRES_DB: mafftserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mafftserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mafftserver:mafftserver@localhost:5432/mafftserver
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # For the smoke tests. Ubuntu's packaged MAFFT; the worker image builds
      # its own pinned version from source (worker.Dockerfile).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mafft
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run worker:typecheck
      - run: npx next build
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:smoke

  images:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Immutable, reproducible tags by commit SHA - never :latest in prod.
      # Built for the bioinformatics.nl/mafft deployment (see DESIGN.md).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/mafft
          tags: ghcr.io/${{ github.repository }}-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
